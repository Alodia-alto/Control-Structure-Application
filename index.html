<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffeef5;
            color: #444;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #d85b86;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #b84f75;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #f0b6c9;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #d85b86;
        }

        #productsContainer {
            margin-top: 20px;
        }

        .product-box {
            background-color: #fff6f9;
            border: 1px solid #f3c5d5;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .product-title {
            color: #d85b86;
            margin-bottom: 15px;
        }

        .calculate-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #d85b86;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .calculate-btn:hover {
            background-color: #c54873;
        }

        #validationMessage {
            margin-top: 15px;
            color: #d14368;
            font-weight: bold;
        }

        #orderSummary {
            margin-top: 25px;
            padding: 18px;
            background-color: #fff6f9;
            border: 1px solid #f3c5d5;
            border-radius: 10px;
        }

        #orderSummary h2 {
            color: #d85b86;
            margin-bottom: 15px;
        }

        .summary-product {
            background-color: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .final-amount {
            font-size: 20px;
            font-weight: bold;
            color: #d85b86;
            border-top: 1px solid #f0b6c9;
            margin-top: 10px;
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>♡ MINI STORE CHECKOUT SYSTEM ♡</h1>

        <p class="subtitle">
            Simple JavaScript Checkout
        </p>

        <form id="checkoutForm">

            <div class="form-group">

                <label for="customerName">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                >

            </div>

            <div class="form-group">

                <label for="productCount">
                    Number of Products
                </label>

                <input
                    type="number"
                    id="productCount"
                    min="1"
                    step="1"
                    placeholder="Enter number of products"
                >

            </div>

            <div id="productsContainer"></div>

            <div class="form-group">

                <label for="deliveryOption">
                    Delivery Option
                </label>

                <select id="deliveryOption">

                    <option value="1">
                        Store Pickup
                    </option>

                    <option value="2">
                        Standard Delivery
                    </option>

                    <option value="3">
                        Express Delivery
                    </option>

                </select>

            </div>

            <div id="validationMessage"></div>

            <button
                type="button"
                id="calculateBtn"
                class="calculate-btn"
            >
                Calculate Order
            </button>

        </form>

        <div id="orderSummary"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
