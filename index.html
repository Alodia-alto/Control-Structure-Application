<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffe6f0;
            color: #555;
            padding: 30px 15px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(216, 91, 134, 0.15);
            border: 2px solid #ffd1df;
        }

        h1 {
            text-align: center;
            color: #d85b86;
            margin-bottom: 8px;
            font-size: 28px;
        }

        h1::before {
            content: "♥ ";
            color: #f29ab7;
        }

        h1::after {
            content: " ♥";
            color: #f29ab7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #b84f75;
            margin-bottom: 7px;
        }

        label::after {
            content: " ♡";
            color: #e89ab3;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #f3b8ca;
            border-radius: 10px;
            font-size: 15px;
            background: #fff9fb;
        }

        input::placeholder {
            color: #c9a5b2;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #d85b86;
            box-shadow: 0 0 6px rgba(216, 91, 134, 0.2);
        }

        #productsContainer {
            margin-top: 20px;
        }

        .product-box {
            background: #fff5f8;
            border: 1px solid #f4c4d3;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 14px;
        }

        .product-title {
            color: #d85b86;
            margin-bottom: 12px;
        }

        .calculate-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #d85b86;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(216, 91, 134, 0.2);
        }

        .calculate-btn::before {
            content: "♡ ";
        }

        .calculate-btn::after {
            content: " ♡";
        }

        .calculate-btn:hover {
            background: #c54873;
        }

        #validationMessage {
            margin-top: 15px;
            margin-bottom: 15px;
            color: #d14368;
            font-weight: bold;
            background: #fff0f4;
            padding: 10px;
            border-radius: 8px;
        }

        #orderSummary {
            margin-top: 25px;
            padding: 20px;
            background: #fff5f8;
            border: 1px solid #f3c5d5;
            border-radius: 14px;
        }

        #orderSummary h2 {
            color: #d85b86;
            margin-bottom: 15px;
            text-align: center;
        }

        #orderSummary h2::before {
            content: "♥ ";
        }

        #orderSummary h2::after {
            content: " ♥";
        }

        .summary-product {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #f7d4df;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .final-amount {
            font-size: 20px;
            font-weight: bold;
            color: #d85b86;
            border-top: 1px solid #f0b6c9;
            margin-top: 10px;
            padding-top: 10px;
        }

        #orderSummary p:last-child {
            background: #ffe6ef;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>MINI STORE CHECKOUT SYSTEM</h1>

        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
            >
        </div>

        <div class="form-group">
            <label for="productCount">Number of Products</label>
            <input
                type="number"
                id="productCount"
                min="1"
                placeholder="Enter number of products"
            >
        </div>

        <div id="productsContainer"></div>

        <div class="form-group">
            <label for="deliveryOption">Delivery Option</label>

            <select id="deliveryOption">
                <option value="1">Store Pickup ♡</option>
                <option value="2">Standard Delivery ♡</option>
                <option value="3">Express Delivery ♡</option>
            </select>
        </div>

        <div id="validationMessage"></div>

        <button
            type="button"
            id="calculateBtn"
            class="calculate-btn"
        >
            Calculate Order
        </button>

        <div id="orderSummary"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
