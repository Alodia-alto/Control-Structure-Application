<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div class="container">

        <h1>♡ MINI STORE CHECKOUT ♡</h1>

        <p class="subtitle">
            Simple JavaScript Checkout
        </p>

        <!-- Customer Name -->
        <div class="form-group">
            <label for="customerName">Customer Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
            >
        </div>

        <!-- Number of Products -->
        <div class="form-group">
            <label for="productCount">Number of Products</label>
            <input
                type="number"
                id="productCount"
                min="1"
                placeholder="Enter number of products"
            >
        </div>

        <!-- Products -->
        <div id="productsContainer"></div>

        <!-- Delivery -->
        <div class="form-group">
            <label for="deliveryOption">Delivery Option</label>

            <select id="deliveryOption">
                <option value="1">Store Pickup - ₱0</option>
                <option value="2">Standard Delivery - ₱20</option>
                <option value="3">Express Delivery - ₱120</option>
            </select>
        </div>

        <!-- Validation -->
        <div id="validationMessage"></div>

        <!-- Button -->
        <button
            type="button"
            id="calculateBtn"
            class="calculate-btn"
        >
            Calculate Order ♡
        </button>

        <!-- Order Summary -->
        <div id="orderSummary"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
