<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #ffeaf2;
            margin: 0;
            padding: 30px 15px;
            color: #555;
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 18px;
            padding: 25px 30px;
            box-shadow: 0 4px 15px rgba(216, 91, 134, 0.15);
            border: 2px solid #ffd0df;
            position: relative;
        }

        .card::before {
            content: "♥";
            position: absolute;
            top: 10px;
            left: 15px;
            color: #f3a1bb;
            font-size: 20px;
        }

        .card::after {
            content: "♥";
            position: absolute;
            top: 10px;
            right: 15px;
            color: #f3a1bb;
            font-size: 20px;
        }

        h1 {
            text-align: center;
            font-size: 23px;
            letter-spacing: 1px;
            color: #d85b86;
            margin-bottom: 20px;
        }

        h1::before {
            content: "♡ ";
        }

        h1::after {
            content: " ♡";
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
            font-size: 14px;
            color: #b84f75;
        }

        label::after {
            content: " ♥";
            font-size: 11px;
            color: #efa1b9;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #f2b6c9;
            border-radius: 9px;
            font-size: 14px;
            background: #fff9fb;
        }

        input::placeholder {
            color: #c9a8b4;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #d85b86;
            box-shadow: 0 0 5px rgba(216, 91, 134, 0.2);
        }

        .product-block {
            border: 1px solid #f3c4d4;
            border-radius: 12px;
            padding: 14px 15px;
            margin-top: 12px;
            background: #fff4f7;
        }

        .product-block h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #d85b86;
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #d85b86;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 7px rgba(216, 91, 134, 0.2);
        }

        button::before {
            content: "♡ ";
        }

        button::after {
            content: " ♡";
        }

        button:hover {
            background: #c54873;
        }

        #validationMessage {
            margin-top: 12px;
            font-size: 13px;
            color: #d14368;
            white-space: pre-wrap;
        }

        #orderSummary {
            margin-top: 20px;
            padding: 15px;
            background: #fff4f7;
            border: 1px solid #f3c4d4;
            border-radius: 12px;
            font-size: 14px;
            white-space: pre-wrap;
        }

        #orderSummary h2 {
            color: #d85b86;
            text-align: center;
        }

        #orderSummary h2::before {
            content: "♥ ";
        }

        #orderSummary h2::after {
            content: " ♥";
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>MINI STORE CHECKOUT SYSTEM</h1>

        <label for="customerName">Customer Name</label>
        <input
            type="text"
            id="customerName"
            placeholder="Enter customer name"
        >

        <label for="productCount">Number of Products</label>
        <input
            type="number"
            id="productCount"
            min="1"
            placeholder="e.g. 2"
        >

        <div id="productsContainer"></div>

        <label for="deliveryOption">Delivery Option</label>

        <select id="deliveryOption">
            <option value="1">Store Pickup (₱0)</option>
            <option value="2">Standard Delivery (₱80)</option>
            <option value="3">Express Delivery (₱150)</option>
        </select>

        <button type="button" id="calculateBtn">
            Calculate Order
        </button>

        <div id="validationMessage"></div>

        <div id="orderSummary"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
